<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream </title>
    <!-- favicon -->
     <link rel="icon" href="images\ice-cream fav.webp">
     <link rel="Stylesheet" href="styles\style.css">

</head>
<body>
    <div id="main">

        <div id="header">
            <h1>Ice Cream Order Form</h1>
        </div>
        <form id="personal-info-form" action="#" methods="get">
            <!-- personal info -->
             <fieldset>
                <legend>Personal Information</legend>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
               <label for="email">Email:</label>
               <input type="email" id="email" name="email">

             </fieldset>

             <fieldset>
                <legend>Order Details</legend>
                <label for="select-flavor">Choose your flavor:</label>
                <select id="flavor" name="flavor">
                    <option value="none">Select a Flavor:</option>
                    <option value="vanilla">Vanilla</option>
                    <option value="strawberry">Strawberry</option>
                    <option value="chocolate">chocolate</option>
                    <option value="cookie-dough">cookie dough</option>
                </select>

                <!-- cone options -->
                <label for="cone">Choose your cone:</label>
                <div id="cone-options">
                <label for="waffle-cone">
                    <input type="radio" id="waffle-cone" name="cone" value="waffle-cone" checked>
                    Waffle Cone
                </label>
                  <label for="sugar-cone">
                    <input type="radio" id="sugar-cone" name="cone" value="sugar-cone">
                    Sugar Cone
                </label>
                  <label for="cup">
                    <input type="radio" id="cup" name="cone" value="cup">
                    cup
                </label>
                </div>
                <!-- toppings -->
               
                <label for="toppings">Toppings:</label>
                 <div id="topping-options">
                <label for="sprinkles">
                    <input type="checkbox" id="sprinkles" name="toppings[]" value="sprinkles">
                    Sprinkles
                </label>
                <label for="nuts">
                    <input type="checkbox" id="nuts" name="toppings[]" value="nuts">
                    Nuts
                </label>
                <label for="cherry">
                    <input type="checkbox" id="cherry" name="toppings[]" value="cherry">
                    Cherry
                </label>
                 <label for="whipped-cream">
                    <input type="checkbox" id="whipped-cream" name="toppings[]" value="whipped-cream">
                    Whipped Cream
                </label>
                </div>

                <label for="comment">Additional Comments:</label>
                <textarea rows="5" id="comment" name="comment"></textarea>
               

             </fieldset>
              <button type="submit" id="order-btn">Submit Order</button>

        </form>
    </div>
    
</body>
</html>
